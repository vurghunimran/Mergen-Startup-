<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Surveys | Mergen Community</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .survey-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #E5E7EB;
            padding: 1.5rem;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .survey-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .status-completed {
            background: #ECFDF5;
            color: #059669;
        }

        .status-inprogress {
            background: #EFF6FF;
            color: #2563EB;
        }
    </style>
</head>

<body style="background: #F8F9FA;">

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="index.html" class="sidebar-logo">
                <img src="images/logo.svg" alt="Mergen Logo">
                MERGEN
            </a>

            <nav class="sidebar-nav">
                <a href="community-dashboard.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    Dashboard
                </a>
                <a href="community-my-surveys.html" class="nav-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    My Surveys
                </a>
                <a href="community-earnings.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                    Earnings
                </a>
                <a href="community-rewards.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polygon
                            points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
                        </polygon>
                    </svg>
                    Rewards
                </a>
            </nav>

            <div class="sidebar-user">
                <div class="user-avatar" id="avatar-initial">A</div>
                <div class="user-info">
                    <span class="user-name" id="sidebar-username">Community Member</span>
                    <span class="user-badge">Elite Member</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <header class="dash-header">
                <div class="header-title">My Survey History</div>
                <div class="header-actions">
                    <!-- Bell -->
                    <div id="notification-bell" style="position:relative; cursor:pointer;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <div
                            style="position:absolute; top:0; right:2px; width:8px; height:8px; background:#EF4444; border-radius:50%; border:2px solid white;">
                        </div>
                        <!-- Dropdown -->
                        <div id="notification-dropdown"
                            style="display:none; position:absolute; top: 120%; right: 0; width: 320px; background: white; border: 1px solid #E5E7EB; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border-radius: 12px; z-index: 100; overflow:hidden;">
                            <div
                                style="padding: 1rem; border-bottom: 1px solid #F3F4F6; font-weight: 700; color: #111827; display: flex; justify-content: space-between;">
                                <span>Notifications</span>
                                <span style="font-size: 0.75rem; color: #E05D3A; cursor: pointer;">Mark all read</span>
                            </div>
                            <div class="notification-list" style="max-height: 300px; overflow-y: auto;">
                                <div style="padding: 1rem; text-align:center; color:#6B7280; font-size:0.9rem;">No new
                                    notifications</div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div style="margin-bottom: 2rem;">
                <h1 style="font-size: 1.8rem; font-weight: 800; color: #111827; margin:0;">Participated Surveys</h1>
                <p style="color: #6B7280; margin-top: 0.5rem;">Track your contributions and earned credits.</p>
            </div>

            <!-- List Grid -->
            <div id="my-survey-grid"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;">
                <!-- Content will be injected dynamically if exists, otherwise empty state below -->
            </div>

            <div id="empty-state"
                style="text-align: center; padding: 4rem 2rem; background: white; border-radius: 16px; border: 1px dashed #E5E7EB; color: #6B7280; display: block;">
                <div
                    style="background: #F3F4F6; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; color: #9CA3AF;">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                </div>
                <h3 style="color: #111827; font-weight: 700; margin-bottom: 0.5rem;">No participation history</h3>
                <p style="font-size: 0.95rem; max-width: 400px; margin: 0 auto;">You usually haven't participated in any
                    surveys yet.</p>
            </div>

        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('mergen_user');
            if (user) {
                try {
                    const u = JSON.parse(user);
                    const name = u.email ? u.email.split('@')[0] : "Member";
                    const displayName = name.charAt(0).toUpperCase() + name.slice(1);
                    if (document.getElementById('sidebar-username')) document.getElementById('sidebar-username').innerText = displayName;
                    if (document.getElementById('avatar-initial')) document.getElementById('avatar-initial').innerText = displayName.charAt(0);
                } catch (e) { }
            }
            // Bell Logic
            const bell = document.getElementById('notification-bell');
            const dropdown = document.getElementById('notification-dropdown');
            if (bell && dropdown) {
                bell.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
                });
                document.addEventListener('click', () => { dropdown.style.display = 'none'; });
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
</body>

</html>
