<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Preview | Mergen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #F3F4F6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 3rem 1rem;
        }

        .survey-container {
            background: white;
            max-width: 640px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .survey-header {
            background: #E05D3A;
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .survey-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .survey-header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .survey-content {
            padding: 2rem;
        }

        .q-item {
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .q-label {
            display: block;
            font-weight: 600;
            color: #111827;
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }

        .q-number {
            color: #E05D3A;
            font-weight: 700;
            margin-right: 0.5rem;
        }

        /* Inputs */
        .preview-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .preview-input:focus {
            border-color: #E05D3A;
            box-shadow: 0 0 0 3px rgba(224, 93, 58, 0.1);
        }

        /* Choice */
        .choice-option {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice-option:hover {
            background: #FFF7ED;
            border-color: #FED7AA;
        }

        .choice-option input {
            margin-right: 0.75rem;
            width: 18px;
            height: 18px;
            accent-color: #E05D3A;
        }

        /* Scale/NPS */
        .scale-grid {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .scale-btn {
            flex: 1;
            height: 48px;
            border: 1px solid #D1D5DB;
            background: white;
            border-radius: 8px;
            font-weight: 600;
            color: #4B5563;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scale-btn:hover {
            border-color: #E05D3A;
            color: #E05D3A;
        }

        .scale-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #6B7280;
            margin-top: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .preview-footer {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #F3F4F6;
            text-align: center;
        }

        .btn-submit {
            background: #111827;
            color: white;
            border: none;
            padding: 1rem 3rem;
            border-radius: 99px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.2);
        }

        .preview-badge {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: #FEF3C7;
            color: #92400E;
            padding: 0.5rem 1.5rem;
            border-radius: 99px;
            font-weight: 700;
            font-size: 0.8rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            z-index: 100;
        }
    </style>
</head>

<body>

    <div class="preview-badge">👀 SURVEY PREVIEW MODE</div>

    <div class="survey-container">
        <div class="survey-header">
            <h1 id="p-title">Research Survey</h1>
            <p id="p-desc">Your feedback helps us improve.</p>
        </div>

        <div class="survey-content" id="p-questions">
            <!-- Questions Injected Here -->
        </div>

        <div class="preview-footer">
            <button class="btn-submit">Submit Responses</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dataStr = localStorage.getItem('mergen_draft_preview');
            if (!dataStr) {
                document.getElementById('p-questions').innerHTML = '<p style="text-align:center; color:#6b7280;">No preview data found. Please return to the editor.</p>';
                return;
            }

            try {
                const data = JSON.parse(dataStr);
                document.getElementById('p-title').innerText = data.title || "Untitled Survey";

                const container = document.getElementById('p-questions');

                data.questions.forEach((q, idx) => {
                    const div = document.createElement('div');
                    div.className = 'q-item';
                    div.style.animationDelay = `${idx * 0.1}s`;

                    let innerHTML = `<label class="q-label"><span class="q-number">${idx + 1}.</span> ${q.text}</label>`;

                    // Visualizations
                    if (q.type === 'Text') {
                        innerHTML += `<input type="text" class="preview-input" placeholder="Type your answer here...">`;
                    } else if (q.type === 'Choice') {
                        const opts = q.options && q.options.length ? q.options : ['Option 1', 'Option 2', 'Option 3'];
                        opts.forEach(opt => {
                            innerHTML += `
                                <label class="choice-option">
                                    <input type="radio" name="q_${q.id}" value="${opt}">
                                    ${opt}
                                </label>
                            `;
                        });
                    } else if (q.type === 'NPS' || q.type === 'Scale') {
                        innerHTML += `<div class="scale-grid">`;
                        for (let i = 1; i <= 10; i++) { // NPS typically 0-10, but keeping simple
                            // If Scale (1-5)
                            if (q.type === 'Scale' && i > 5) break;
                            innerHTML += `<button class="scale-btn">${i}</button>`;
                        }
                        innerHTML += `</div>`;
                        innerHTML += `
                            <div class="scale-labels">
                                <span>Not Likely</span>
                                <span>Very Likely</span>
                            </div>
                        `;
                    }

                    div.innerHTML = innerHTML;
                    container.appendChild(div);
                });

            } catch (e) {
                console.error("Preview Error", e);
            }
        });
    </script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
<script src="js/supabase-config.js"></script></body>

</html>
